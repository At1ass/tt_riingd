[package]
name = "tt_riingd"
version = "1.0.0"
edition = "2024"

[features]
tokio-console = []

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true

[profile.profiling]              # любое имя, главное — уникальное
inherits       = "release"       # копируем всё из release
debug          = true            # DWARF-символы
strip          = "none"          # ничего не выбрасываем
lto            = false           # профилировщикам LTO не нужна, а сборка быстрее

[[bin]]
name = "tt_riingd"
path = "src/bin/main.rs"

[dependencies]
# Async
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread", "sync", "signal", "tracing", "full"] }
tokio-stream = "0.1.17"
async-stream = "0.3.0"
console-subscriber = "0.4.1"
arc-swap = "1.7.1"

# OS
zbus = { version = "5.6.0", default-features = false, features = ["tokio"] }
hidapi = { version = "2.6" }
daemonize = "0.5"
signal-hook = { version = "0.3", features = ["iterator"] }
event-listener = "5.4.0"
arrayvec = "0.7.4"
tokio-udev = "0.9"
udev = "0.7"

# Config
# unconfig = { git = "https://github.com/rojer-98/unconfig.git", default-features = false }

# Logging - modern tracing ecosystem
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "registry"] }
tracing-appender = "0.2"
syslog = "6.0"

# Helpers
uuid = { version = "1.7", features = ["v4"] }
anyhow = "1.0"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"]}
serde_json = "1.0.140"
zvariant = { version = "5.5.1" }
async-trait = "0.1.88"
futures = "0.3.31"
lm-sensors = "0.3.2"
libloading = "0.8"
dashmap = "7.0.0-rc2"
serde_yaml = "0.9.34"
clap = { version = "4.5.38", features = ["derive"] }
once_cell = "1.21.3"
tokio-util = "0.7.15"
notify = "8.0.0"

[dev-dependencies]
# Testing framework
tokio-test = "0.4"              # async testing utilities
mockall = "0.12"                # mocking framework for traits
tempfile = "3.8"                # temporary files for config tests
serial_test = "3.0"             # run tests serially when needed
pretty_assertions = "1.4"       # better assertion output
proptest = "1.4"                # property-based testing
